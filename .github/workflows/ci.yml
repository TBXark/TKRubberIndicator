name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: macos-15
    env:
      DERIVED_DATA: .build/DerivedData

    steps:
      - uses: actions/checkout@v4

      # Pick the newest Xcode on the image: its SDK is always >= every installed
      # simulator runtime, so each runtime stays usable. Pinning an older Xcode
      # fails when the image only ships newer runtimes (e.g. Xcode 16.0 with its
      # iOS 18.0 SDK cannot run the iOS 18.5 runtime), which leaves no iOS
      # Simulator destination at all.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using ${XCODE}"
          sudo xcode-select -s "${XCODE}"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Validate package manifest
        run: swift package dump-package > /dev/null

      # Resolve a concrete iPhone simulator by UDID. Names can be ambiguous
      # across runtimes, so match on the device id instead.
      - name: Resolve simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for entries in devices.values():
              for entry in entries:
                  if entry.get("isAvailable") and entry["name"].startswith("iPhone"):
                      print(entry["udid"])
                      sys.exit(0)
          sys.exit(1)
          ')
          if [ -z "${UDID}" ]; then
            echo "error: no available iPhone simulator found." >&2
            exit 1
          fi
          echo "udid=${UDID}" >> "$GITHUB_OUTPUT"

      - name: Build library for iOS
        run: |
          xcodebuild -scheme TKRubberPageControl \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$DERIVED_DATA" \
            build

      - name: Run tests
        run: |
          xcodebuild -scheme TKRubberPageControl \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$DERIVED_DATA" \
            test

      - name: Check formatting
        run: swift format lint --recursive --strict Sources Tests Demo/Sources

      - name: Generate demo project
        run: |
          brew install xcodegen
          cd Demo && xcodegen generate

      - name: Build demo app
        run: |
          xcodebuild -project Demo/TKRubberPageControlDemo.xcodeproj \
            -scheme TKRubberPageControlDemo \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$DERIVED_DATA" \
            build

      - name: Lint podspec
        run: pod lib lint TKRubberPageControl.podspec --allow-warnings --quick
